[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raise-assistant"
version = "0.1.0"
description = "Portable local RAISE discovery and solution-design assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic[vertex]>=0.52.0",
  "fastapi>=0.115.0",
  "google-auth>=2.29.0",
  "google-genai>=1.20.0",
  "openai>=1.82.0",
  "openpyxl>=3.1.2",
  "pydantic>=2.8.0",
  "pypdf>=5.0.0",
  "python-docx>=1.1.2",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.2.0",
]

[project.scripts]
raise-assistant = "raise_assistant.app:main"
raise-doctor = "raise_assistant.doctor:main"

[tool.hatch.build.targets.wheel]
packages = ["src/raise_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

